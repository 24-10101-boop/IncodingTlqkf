<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리학교 급식표 - 자운고등학교</title>
    <!-- Use Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background-aurora"></div>
    <div class="container container-wide">
        <header>
            <h1 class="title">우리학교 급식표</h1>
            <p class="subtitle">자운고등학교</p>
        </header>

        <section class="date-controller">
            <button id="prevBtn" class="nav-btn" aria-label="이전 달">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <div class="current-date-display">
                <h2 id="monthDisplay">로드 중...</h2>
                <span id="yearDisplay" class="year-badge">-</span>
            </div>
            <button id="nextBtn" class="nav-btn" aria-label="다음 달">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
            </button>
        </section>

        <section class="controls">
            <button id="todayBtn" class="today-btn">이번 달로 가기</button>
        </section>

        <!-- Loader -->
        <div class="loader" id="loader"></div>

        <main id="calendarContainer" class="calendar-container hidden">
            <!-- Calendar Header (Days of week) -->
            <div class="calendar-header">
                <div class="sun">일</div>
                <div>월</div>
                <div>화</div>
                <div>수</div>
                <div>목</div>
                <div>금</div>
                <div class="sat">토</div>
            </div>
            <!-- Calendar Grid -->
            <div id="calendarGrid" class="calendar-grid">
                <!-- Days will be generated by JS -->
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
